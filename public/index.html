<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Complaint & Maintenance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold">Campus Complaint & Maintenance Tracker</h1>
        <p class="text-indigo-200 text-sm">Student & Staff Portal</p>
      </div>
      <a href="admin.html"
         class="inline-block bg-white text-indigo-700 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-indigo-50 transition text-center">
        Maintenance Admin View
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">

    <!-- Report form -->
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-semibold mb-1">Report an Issue</h2>
      <p class="text-sm text-slate-500 mb-5">Spotted something broken? Tell us where it is and attach a photo if you can.</p>

      <div id="formMessage" class="hidden mb-4 rounded-lg px-4 py-3 text-sm" role="alert"></div>

      <form id="complaintForm" class="space-y-4" novalidate>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="reporter_name" class="block text-sm font-medium mb-1">Your Name</label>
            <input type="text" id="reporter_name" name="reporter_name" required maxlength="100"
                   placeholder="e.g., Priya Sharma"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="reporter_role" class="block text-sm font-medium mb-1">Role</label>
            <select id="reporter_role" name="reporter_role" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Student">Student</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="department_location" class="block text-sm font-medium mb-1">Location</label>
            <input type="text" id="department_location" name="department_location" required maxlength="150"
                   placeholder="e.g., Block A - Room 204, Physics Lab 2"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="category" class="block text-sm font-medium mb-1">Category</label>
            <select id="category" name="category" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Broken Lights">Broken Lights</option>
              <option value="Plumbing">Plumbing</option>
              <option value="Lab Fault">Lab Fault</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label for="title" class="block text-sm font-medium mb-1">Issue Title</label>
          <input type="text" id="title" name="title" required maxlength="150"
                 placeholder="e.g., Tube light flickering in corridor"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label for="description" class="block text-sm font-medium mb-1">Description</label>
          <textarea id="description" name="description" required rows="4" maxlength="2000"
                    placeholder="Describe the problem in as much detail as possible..."
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label for="photo" class="block text-sm font-medium mb-1">Photo (optional, max 5 MB)</label>
          <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/gif,image/webp"
                 class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100" />
          <div id="previewWrap" class="hidden mt-3 relative inline-block">
            <img id="previewImg" alt="Selected photo preview"
                 class="max-h-48 rounded-lg border border-slate-200 shadow-sm" />
            <button type="button" id="removePhoto"
                    class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-7 h-7 text-sm font-bold shadow hover:bg-red-700"
                    aria-label="Remove photo">&times;</button>
          </div>
        </div>

        <button type="submit" id="submitBtn"
                class="w-full sm:w-auto bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition">
          Submit Report
        </button>
      </form>
    </section>

    <!-- Feed -->
    <section>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
        <h2 class="text-xl font-semibold">Recent Campus Complaints</h2>
        <div class="flex flex-wrap gap-2">
          <select id="filterCategory" aria-label="Filter by category"
                  class="border border-slate-300 rounded-lg px-3 py-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All Categories</option>
            <option value="Broken Lights">Broken Lights</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Lab Fault">Lab Fault</option>
            <option value="Other">Other</option>
          </select>
          <select id="filterStatus" aria-label="Filter by status"
                  class="border border-slate-300 rounded-lg px-3 py-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <button type="button" id="refreshBtn"
                  class="border border-slate-300 bg-white rounded-lg px-3 py-2 text-sm hover:bg-slate-100">
            Refresh
          </button>
        </div>
      </div>

      <div id="feedState" class="text-center text-slate-500 py-10 hidden"></div>
      <div id="feed" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </section>
  </main>

  <footer class="text-center text-xs text-slate-400 py-6">
    Campus Complaint & Maintenance Tracker
  </footer>

  <script>
    const MAX_FILE_SIZE = 5 * 1024 * 1024;
    const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

    const STATUS_STYLES = {
      'Pending': 'bg-yellow-100 text-yellow-800 border-yellow-300',
      'In Progress': 'bg-blue-100 text-blue-800 border-blue-300',
      'Resolved': 'bg-green-100 text-green-800 border-green-300'
    };

    const form = document.getElementById('complaintForm');
    const submitBtn = document.getElementById('submitBtn');
    const formMessage = document.getElementById('formMessage');
    const photoInput = document.getElementById('photo');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const removePhotoBtn = document.getElementById('removePhoto');
    const feed = document.getElementById('feed');
    const feedState = document.getElementById('feedState');
    const filterCategory = document.getElementById('filterCategory');
    const filterStatus = document.getElementById('filterStatus');
    const refreshBtn = document.getElementById('refreshBtn');

    let previewUrl = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(sqliteDate) {
      if (!sqliteDate) return '';
      const date = new Date(sqliteDate.replace(' ', 'T') + 'Z');
      if (isNaN(date.getTime())) return sqliteDate;
      return date.toLocaleString(undefined, {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = 'mb-4 rounded-lg px-4 py-3 text-sm ' +
        (type === 'success'
          ? 'bg-green-50 text-green-800 border border-green-200'
          : 'bg-red-50 text-red-800 border border-red-200');
    }

    function hideMessage() {
      formMessage.className = 'hidden mb-4 rounded-lg px-4 py-3 text-sm';
      formMessage.textContent = '';
    }

    // ----- Photo preview -----
    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      previewImg.removeAttribute('src');
      previewWrap.classList.add('hidden');
      photoInput.value = '';
    }

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) {
        clearPreview();
        return;
      }
      if (!ALLOWED_TYPES.includes(file.type)) {
        clearPreview();
        showMessage('Only JPG, PNG, GIF, or WEBP images are allowed.', 'error');
        return;
      }
      if (file.size > MAX_FILE_SIZE) {
        clearPreview();
        showMessage('Image is too large. Maximum size is 5 MB.', 'error');
        return;
      }
      hideMessage();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      previewImg.src = previewUrl;
      previewWrap.classList.remove('hidden');
    });

    removePhotoBtn.addEventListener('click', clearPreview);

    // ----- Submit form -----
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const requiredFields = ['reporter_name', 'department_location', 'title', 'description'];
      for (const name of requiredFields) {
        if (!form.elements[name].value.trim()) {
          showMessage('Please fill in all required fields.', 'error');
          form.elements[name].focus();
          return;
        }
      }

      const formData = new FormData(form);
      if (!photoInput.files[0]) formData.delete('photo');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const response = await fetch('/api/complaints', { method: 'POST', body: formData });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const details = Array.isArray(data.details) ? ' ' + data.details.join(' ') : '';
          throw new Error((data.error || 'Could not submit your report.') + details);
        }

        form.reset();
        clearPreview();
        showMessage('Thank you! Your report was submitted successfully.', 'success');
        loadComplaints();
      } catch (err) {
        showMessage(err.message || 'Network error. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Report';
      }
    });

    // ----- Feed -----
    function renderCard(c) {
      const statusClass = STATUS_STYLES[c.status] || 'bg-slate-100 text-slate-700 border-slate-300';
      const photoHtml = c.photo_path
        ? `<a href="${escapeHtml(c.photo_path)}" target="_blank" rel="noopener">
             <img src="${escapeHtml(c.photo_path)}" alt="Photo for ${escapeHtml(c.title)}"
                  loading="lazy" class="w-full h-48 object-cover" />
           </a>`
        : '';
      const noteHtml = c.admin_note
        ? `<div class="mt-3 bg-slate-50 border-l-4 border-indigo-400 rounded p-3">
             <p class="text-xs font-semibold text-indigo-700 mb-1">Maintenance Note</p>
             <p class="text-sm text-slate-700 whitespace-pre-line">${escapeHtml(c.admin_note)}</p>
           </div>`
        : '';

      return `
        <article class="bg-white rounded-xl shadow overflow-hidden flex flex-col">
          ${photoHtml}
          <div class="p-4 flex-1 flex flex-col">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800">${escapeHtml(c.category)}</span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${statusClass}">${escapeHtml(c.status)}</span>
            </div>
            <h3 class="font-semibold text-lg leading-snug">${escapeHtml(c.title)}</h3>
            <p class="text-sm text-slate-500 mt-1">📍 ${escapeHtml(c.department_location)}</p>
            <p class="text-sm text-slate-700 mt-2 whitespace-pre-line">${escapeHtml(c.description)}</p>
            ${noteHtml}
            <p class="text-xs text-slate-400 mt-auto pt-3">
              Reported by ${escapeHtml(c.reporter_name)} (${escapeHtml(c.reporter_role)}) &middot; ${escapeHtml(formatDate(c.created_at))}
            </p>
          </div>
        </article>`;
    }

    async function loadComplaints() {
      const params = new URLSearchParams();
      if (filterCategory.value) params.set('category', filterCategory.value);
      if (filterStatus.value) params.set('status', filterStatus.value);
      const query = params.toString();

      feed.innerHTML = '';
      feedState.textContent = 'Loading complaints...';
      feedState.classList.remove('hidden');

      try {
        const response = await fetch('/api/complaints' + (query ? '?' + query : ''));
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error((data && data.error) || 'Could not load complaints.');
        }
        if (!Array.isArray(data) || data.length === 0) {
          feedState.textContent = 'No complaints found.';
          return;
        }
        feedState.classList.add('hidden');
        feed.innerHTML = data.map(renderCard).join('');
      } catch (err) {
        feedState.textContent = err.message || 'Network error while loading complaints.';
        feedState.classList.remove('hidden');
      }
    }

    filterCategory.addEventListener('change', loadComplaints);
    filterStatus.addEventListener('change', loadComplaints);
    refreshBtn.addEventListener('click', loadComplaints);

    loadComplaints();
  </script>
</body>
</html>
